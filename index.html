<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>JARVIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Exo+2:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- Núcleo: identidade e estado do assistente -->
    <aside class="nucleo">
      <div class="orbe" id="orbe" data-estado="repouso">
        <svg viewBox="0 0 200 200" role="img" aria-label="Núcleo do JARVIS">
          <defs>
            <radialGradient id="brilho">
              <stop offset="0" stop-color="#ffd9d4"/>
              <stop offset="0.3" stop-color="#ff2a2a"/>
              <stop offset="1" stop-color="#6e0a10" stop-opacity="0.15"/>
            </radialGradient>
          </defs>
          <circle class="anel anel-marcas" cx="100" cy="100" r="96"/>
          <circle class="anel anel-arcos" cx="100" cy="100" r="82"/>
          <circle class="anel anel-fino" cx="100" cy="100" r="66"/>
          <circle class="anel anel-interno" cx="100" cy="100" r="50"/>
          <circle class="miolo" cx="100" cy="100" r="30" fill="url(#brilho)"/>
        </svg>
      </div>

      <div class="nucleo-texto">
        <h1>JARVIS</h1>
        <p class="estado" id="estado">Online</p>
        <p class="modo" id="modo">Modo demonstração</p>
      </div>

      <button class="botao-ajustes" id="abrir-ajustes" type="button" aria-label="Abrir ajustes">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
        <span>Ajustes</span>
      </button>
    </aside>

    <!-- Conversa -->
    <main class="conversa">
      <section class="historico" id="historico">
        <div class="vazio" id="vazio">
          <h2>Sistemas online.</h2>
          <p>Escreva ou toque no microfone para falar. Se quiser, comece por aqui:</p>
          <div class="sugestoes">
            <button type="button" class="sugestao" data-texto="Que horas são?">Que horas são?</button>
            <button type="button" class="sugestao" data-texto="Que dia é hoje?">Que dia é hoje?</button>
            <button type="button" class="sugestao" data-texto="O que você sabe fazer?">O que você sabe fazer?</button>
          </div>
        </div>
        <ol class="lista" id="lista" role="log" aria-live="polite" aria-label="Histórico de mensagens"></ol>
      </section>

      <form class="compositor" id="formulario" autocomplete="off">
        <label class="so-leitor" for="campo">Mensagem para o JARVIS</label>
        <textarea id="campo" rows="1" placeholder="Fale com o JARVIS" enterkeyhint="send"></textarea>
        <button class="botao-icone" id="microfone" type="button" aria-label="Falar com o microfone" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
          </svg>
        </button>
        <button class="botao-icone botao-enviar" id="enviar" type="submit" aria-label="Enviar mensagem">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <!-- Ajustes -->
  <dialog class="ajustes" id="ajustes" aria-labelledby="ajustes-titulo">
    <form id="form-ajustes">
      <h2 id="ajustes-titulo">Ajustes</h2>

      <label class="opcao-voz">
        <input type="checkbox" id="opcao-voz">
        <span>Responder em voz alta</span>
      </label>
      <p class="ajuda" id="ajuda-voz"></p>

      <label class="rotulo" for="opcao-endereco">Endereço da IA (opcional)</label>
      <input type="url" id="opcao-endereco" placeholder="https://seu-endereco.workers.dev" inputmode="url" spellcheck="false">
      <p class="ajuda">Deixe em branco para usar o modo demonstração. Nunca cole chaves de API aqui: ela vai no servidor (veja a etapa 2 do README).</p>
      <p class="erro-ajustes" id="erro-ajustes" role="alert" hidden></p>

      <div class="acoes">
        <button type="button" class="botao-texto perigo" id="limpar">Limpar histórico</button>
        <span class="espaco"></span>
        <button type="button" class="botao-texto" id="fechar-ajustes">Cancelar</button>
        <button type="submit" class="botao-cheio">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="js/brain.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
